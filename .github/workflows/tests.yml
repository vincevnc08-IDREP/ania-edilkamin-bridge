name: Tests hors matériel
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s radio -p 'test_*.py'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/test_card.js
      - run: node tests/test_card_stale.cjs
      - run: cc -Wall -Wextra tests/test_wire.c -o /tmp/ania-wire-test && /tmp/ania-wire-test
